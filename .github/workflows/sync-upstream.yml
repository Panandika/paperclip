name: Sync upstream
on:
  schedule:
    - cron: "0 3 * * 0"   # Sunday 03:00 UTC = 10:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: thinkpad

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: git remote add upstream https://github.com/paperclipai/paperclip.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Fast-forward master
        run: |
          git checkout -B master origin/master
          git merge --ff-only upstream/master
          git push origin master

      - name: Rebase thinkpad onto master
        id: rebase
        continue-on-error: true
        run: |
          git checkout thinkpad
          git rebase master
          git push --force origin thinkpad

      - name: Open issue on conflict
        if: steps.rebase.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync conflict ${new Date().toISOString().slice(0,10)}`,
              body: [
                "Auto-rebase of `thinkpad` onto `upstream/master` failed.",
                "",
                "SSH ThinkPad and resolve manually:",
                "",
                "```",
                "cd ~/docker/paperclip",
                "git fetch origin upstream",
                "git checkout thinkpad",
                "git rebase origin/master",
                "# resolve, then",
                "git push --force origin thinkpad",
                "```"
              ].join("\n")
            })

  keepalive:
    runs-on: ubuntu-latest
    needs: sync
    if: github.event_name == 'schedule'
    steps:
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          time_elapsed: 50
